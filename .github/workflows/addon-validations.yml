name: Add-on Validations
on:
  push:
    branches: [omega]
  pull_request:
    branches: [omega]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
  package:
    permissions:
      contents: read
      id-token: write
    needs: tests
    uses: Serph91P/repository.serph91p/.github/workflows/reusable-addon-package.yml@a554cd91f5fd94635b859835ae9cfff14f70a46d
    with:
      addon_id: skin.arctic.fuse.3
      runtime_entries_json: '["addon.xml","LICENSE.txt","1080i/","colors/","extras/","fanart.jpg","fonts/","icon.png","language/","media/","shortcuts/"]'
